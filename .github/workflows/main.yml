name: Build Samsung Kernel guamp

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v7

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            bc \
            cpio \
            zip \
            unzip \
            zstd \
            patchelf \
            curl \
            git

      - name: Configure and Build Kernel
        run: bash compile.sh guamp

      - name: AnyKernel3
        run: git clone https://github.com/osm0sis/AnyKernel3.git

      - name: Build AnyKernel package
        run: |
         cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
         cd AnyKernel3
         zip -r9 "../alessandro guamp KernelSU.zip" * -x .git .github README.md *placeholder

      - name: Upload AnyKernel package
        uses: actions/upload-artifact@v7
        with:
         name: AnyKernel package
         path: alessandro guamp KernelSU.zip

  
